[settings]

idiomatic_version_file_enable_tools = ["bun", "node"] # dotnet

  [settings.upgrade]
  prune_after = "0s"

[tools]

bun = "latest"

go = { version = "latest", postinstall = """
  go install github.com/go-delve/delve/cmd/dlv@latest &&
  go install golang.org/x/tools/gopls@latest
""" }

"go:github.com/go-delve/delve/cmd/dlv" = "latest"
"go:github.com/z-shell/zsh-lint/cmd/zsh-lint" = "1.3.0" # https://github.com/z-shell/zsh-lint/issues/653
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"

node = "latest"

"npm:npm" = "latest"

"npm:eslint" = { version = "latest", depends = ["npm:npm"] }
"npm:neovim" = { version = "latest", depends = ["npm:npm"] }
"npm:typescript" = { version = "latest", depends = ["npm:npm"] }
